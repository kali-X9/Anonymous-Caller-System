name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * 1'  # Weekly security scan

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.9, 3.10, 3.11]
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y tor openvpn
        
    - name: Create Virtual Environment
      run: |
        python -m venv venv
        source venv/bin/activate
        echo "PATH=$(pwd)/venv/bin:$PATH" >> $GITHUB_ENV
    
    - name: Upgrade Pip and Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov flake8 bandit
    
    - name: Lint with Flake8
      run: |
        flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 src/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Security Scan with Bandit
      run: |
        bandit -r src/ -ll
    
    - name: Run Unit Tests
      run: |
        python -m pytest tests/ -v --cov=src/
    
    - name: Validate Import Structure
      run: |
        python -c "import src; print('Package import successful')"
    
    - name: Check Configuration Loading
      run: |
        python -c "from src.config import config; print('Configuration loaded:', list(config.keys()))"
    
  docker-build:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
      
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      
    - name: Extract Metadata
      id: meta
      uses: docker/metadata-action@v4
      with:
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=sha
      
    - name: Build and Push Docker Image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
  
  security-audit:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3
      
    - name: Run Safety Check
      uses: pyupio/safety-action@v1
      with:
        api-key: ${{ secrets.SAFETY_API_KEY }}
        
    - name: Run Dependency Check
      uses: dependency-check/Dependency-Check_Action@main
      with:
        project: 'anonymous-caller'
        path: '.'
        format: 'HTML'
        out: 'reports'
        
    - name: Upload Dependency Check Report
      uses: actions/upload-artifact@v3
      with:
        name: Dependency-Check-Report
        path: reports/
  
  code-quality:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3
      with:
        fetch-depth: 0
        
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install Quality Tools
      run: |
        pip install black isort mypy radon
        
    - name: Check Code Formatting with Black
      run: |
        black --check src/
        
    - name: Check Import Sorting with Isort
      run: |
        isort --check-only src/
        
    - name: Type Checking with MyPy
      run: |
        mypy --package src
        
    - name: Cyclomatic Complexity Analysis
      run: |
        radon cc src/ --total-average
        
    - name: Maintainability Index
      run: |
        radon mi src/
  
  deploy-preview:
    needs: [build-and-test, code-quality]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
    - name: Deploy Preview Environment
      run: |
        echo "Deploying preview environment for PR #${{ github.event.number }}"
        # Add deployment logic here
  
  release:
    needs: [build-and-test, code-quality, docker-build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Create Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ github.run_number }}
        release_name: Release v${{ github.run_number }}
        draft: false
        prerelease: false
